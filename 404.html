<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sayfa bulunamadı | Ergüneş</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.ico" sizes="any">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #291F1C; color: #F1E4CC;
    font-family: 'Archivo', system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  img { width: 120px; height: 120px; margin: 0 auto 24px; display: block; }
  h1 { font-family: 'Cinzel', Georgia, serif; font-weight: 600; color: #C9A26B; font-size: clamp(28px, 6vw, 44px); margin: 0 0 12px; }
  p { color: #CDBFA8; margin: 0 0 28px; }
  a { color: #291F1C; background: #C9A26B; text-decoration: none; padding: 12px 22px; border-radius: 999px; font-weight: 600; display: inline-block; }
  a:focus-visible { outline: 2px solid #E6B865; outline-offset: 4px; }
</style>
</head>
<body>
  <main>
    <img src="assets/img/logo.png" alt="Ergüneş logosu" width="120" height="120">
    <h1>Bu sayfa yok</h1>
    <p>Aradığınız adres değişmiş olabilir. Kahveler ana sayfada.</p>
    <a href="./">Ana sayfaya dön</a>
  </main>
</body>
</html>
